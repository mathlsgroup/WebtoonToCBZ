<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Webtoon to CBZ — Review</title><link rel="stylesheet" href="popup.css"></head>
<body class="review">
<h1>Review chapter images</h1>
<p id="status" role="status">Loading...</p>
<p>Keep this tab open until export completes. Check order, remove ads, and verify that every chapter page is present. Navigation or reload of the source tab resets capture. Use only for images you are authorized to save.</p>
<div class="buttons"><button id="start">Start</button><button id="stop">Stop</button><button id="refresh">Refresh</button></div>
<label>CBZ filename <input id="title" type="text" placeholder="Series - 0280"></label>
<div id="list"></div>
<button id="export" disabled>Export selected images to CBZ</button>
<script src="jszip.min.js"></script><script src="export.js"></script><script src="popup.js"></script>
</body></html>
